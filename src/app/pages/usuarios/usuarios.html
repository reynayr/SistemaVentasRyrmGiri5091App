<div class="usuarios-container">

  <div class="toolbar">
    <button mat-raised-button color="primary" (click)="onOpenModal()">Nuevo Alumno</button>
  </div>

  <table mat-table [dataSource]="usuarios" class="mat-elevation-z8" *ngIf="usuarios">

    <!-- Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let alumno"> {{ alumno.nombre }} </td>
    </ng-container>

    <!-- Apellidos -->
    <ng-container matColumnDef="apellidos">
      <th mat-header-cell *matHeaderCellDef> Apellidos </th>
      <td mat-cell *matCellDef="let alumno"> {{ alumno.apellidos }} </td>
    </ng-container>

    <!-- Correo -->
    <ng-container matColumnDef="correo">
      <th mat-header-cell *matHeaderCellDef> Correo </th>
      <td mat-cell *matCellDef="let alumno"> {{ alumno.correo }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let alumno">
        <button mat-icon-button (click)="onOpenModal(alumno)">
          <mat-icon style="color: #ba005c">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="onDelete(alumno)">
          <mat-icon style="color: #ba005c">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <div *ngIf="usuarios" class="empty-message">
    No hay alumnos registrados.
  </div>
</div>
